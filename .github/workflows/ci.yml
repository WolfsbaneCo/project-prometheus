name: CI

# Builds run only when asked for, to save the account's Actions minutes (Windows runners count
# double): Actions > CI > Run workflow. On main that publishes a release; on any other branch it
# builds a test installer. Pushing a version tag (v1.2.3) also builds and publishes. Before each
# push, run the same checks locally instead: tools/check-before-push.sh.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A second run of the same branch or tag replaces one still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Brief 8.4: round-trip tests for every converter run in CI before any converter touches real saves.
  save-converters:
    name: Save converters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROMETHEUS64_BUILD_APP=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Round-trip and golden tests
        run: ctest --test-dir build -C Release --output-on-failure

  # Brief 8.4 and 12: game files, saves and save states must never be committed.
  no-game-or-save-files:
    name: No game or save files committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tracked files
        run: CHECK_FILES_ONLY=1 tools/check-before-push.sh

  # The emulator cores (N64 and GBA), cross-compiled at the commits pinned in their scripts.
  # Cached on those commits.
  core-windows:
    name: Emulator cores (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find the pinned core commit
        id: pin
        run: |
          echo "commit=$(grep -oP '^CORE_COMMIT=\K[0-9a-f]+' tools/build-core-windows.sh)" >> "$GITHUB_OUTPUT"
          echo "gba=$(grep -oP 'P64_GPSP_COMMIT \K[0-9a-f]+' apps/prometheus64/third_party/gpsp/CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: core
          key: core-windows-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.gba }}-${{ hashFiles('tools/build-core-windows.sh', 'tools/build-gba-core-windows.sh', 'tools/mingw-w64.cmake', 'apps/prometheus64/third_party/gpsp/CMakeLists.txt') }}
      - name: Install MinGW-w64
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/build-core-windows.sh core
          tools/build-gba-core-windows.sh core
      - uses: actions/upload-artifact@v7
        with:
          name: core-windows
          path: core/

  app-linux:
    name: Project Prometheus (Linux build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxkbcommon-dev libxtst-dev libxrender-dev libxinerama-dev \
            libwayland-dev libegl-dev libgl-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  # The online play relay (relay/), run locally by wrangler and checked from outside.
  relay:
    name: Online relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Test
        run: |
          npm run dev > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          npm test || { cat wrangler.log; exit 1; }

  # The download for players: one installer that holds the app, the core, fonts and licences.
  app-windows:
    name: Project Prometheus (Windows installer)
    runs-on: windows-latest
    needs: core-windows
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        # Google Drive backup needs the app's Google client ID: repository secrets, never in the repo.
        # Without them the build works, with Drive backup switched off.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DP64_GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID" "-DP64_GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET"
      - name: Build
        run: cmake --build build --config Release --parallel --target prometheus64
      - uses: actions/download-artifact@v8
        with:
          name: core-windows
          path: core
      - name: Stage
        shell: pwsh
        run: |
          $app = "build/apps/prometheus64/Release"
          New-Item -ItemType Directory -Force stage/cores, stage/licenses | Out-Null
          Copy-Item "$app/ProjectPrometheus.exe" stage/
          Copy-Item -Recurse "$app/assets" stage/
          Copy-Item core/mupen64plus_next_libretro.dll stage/cores/
          Copy-Item core/CORE-SOURCE.txt stage/cores/
          Copy-Item core/gpsp_libretro.dll stage/cores/
          Copy-Item core/GBA-CORE-SOURCE.txt stage/cores/
          Copy-Item installer/THIRD-PARTY-NOTICES.txt, installer/GPL-2.0.txt, installer/libarchive-COPYING.txt, installer/TERMS.txt, LICENSE, NOTICE, TRADEMARKS.md stage/licenses/
          Get-ChildItem -Recurse stage | Select-Object FullName, Length
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(grep -oP 'project\(prometheus64 VERSION \K[0-9.]+' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF#refs/tags/v}; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DStageDir=$PWD\stage" installer\project-prometheus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Uploaded as the bare .exe (not zipped), so the download is the installer itself.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/ProjectPrometheus-Setup-${{ steps.version.outputs.version }}.exe
          archive: false

  # Publishes the installer as a GitHub release: push a tag like v0.1.0, or run this workflow by
  # hand on main (Actions > CI > Run workflow), which tags main with the version in CMakeLists.txt.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [app-windows, save-converters, no-game-or-save-files]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ProjectPrometheus-Setup-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.app-windows.outputs.version }}
        run: gh release create "$TAG" $(find dist -type f -name '*.exe') --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Project Prometheus ${TAG#v}" --generate-notes
