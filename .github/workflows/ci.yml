name: CI

# Builds run only when asked for, to save the account's Actions minutes (Windows runners count
# double): Actions > CI > Run workflow. On main that publishes a release; on any other branch it
# builds a test installer. Pushing a version tag (v1.2.3) also builds and publishes. Before each
# push, run the same checks locally instead: tools/check-before-push.sh.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A second run of the same branch or tag replaces one still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Brief 8.4: round-trip tests for every converter run in CI before any converter touches real saves.
  save-converters:
    name: Save converters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROMETHEUS64_BUILD_APP=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Round-trip and golden tests
        run: ctest --test-dir build -C Release --output-on-failure

  # Brief 8.4 and 12: game files, saves and save states must never be committed.
  no-game-or-save-files:
    name: No game or save files committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tracked files
        run: CHECK_FILES_ONLY=1 tools/check-before-push.sh

  # The emulator cores (N64, GBA and Game Boy), cross-compiled at the commits pinned in their scripts.
  # Cached on those commits.
  core-windows:
    name: Emulator cores (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find the pinned core commit
        id: pin
        run: |
          echo "commit=$(grep -oP '^CORE_COMMIT=\K[0-9a-f]+' tools/build-core-windows.sh)" >> "$GITHUB_OUTPUT"
          echo "gba=$(grep -oP 'P64_GPSP_COMMIT \K[0-9a-f]+' apps/prometheus64/third_party/gpsp/CMakeLists.txt)" >> "$GITHUB_OUTPUT"
          echo "gb=$(grep -oP 'P64_GAMBATTE_COMMIT \K[0-9a-f]+' apps/prometheus64/third_party/gambatte/CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: core
          key: core-windows-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.gba }}-${{ steps.pin.outputs.gb }}-${{ hashFiles('tools/build-core-windows.sh', 'tools/build-gba-core-windows.sh', 'tools/build-gb-core-windows.sh', 'tools/mingw-w64.cmake', 'apps/prometheus64/third_party/gpsp/CMakeLists.txt', 'apps/prometheus64/third_party/gambatte/**', 'apps/prometheus64/third_party/libretro/libretro.h') }}
      - name: Install MinGW-w64
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/build-core-windows.sh core
          tools/build-gba-core-windows.sh core
          tools/build-gb-core-windows.sh core
      - uses: actions/upload-artifact@v7
        with:
          name: core-windows
          path: core/

  # The PSP emulator core (PPSSPP), cross-compiled at the release pinned in its script, with its
  # own FFmpeg. A long build (most of an hour), so it has its own cache: it runs again only when
  # its script changes.
  psp-core-windows:
    name: PSP emulator core (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: cache
        with:
          path: psp-core
          key: psp-core-windows-${{ hashFiles('tools/build-psp-core-windows.sh', 'tools/mingw-w64.cmake') }}
      - name: Install MinGW-w64
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-psp-core-windows.sh psp-core
      - uses: actions/upload-artifact@v7
        with:
          name: psp-core-windows
          path: psp-core/

  app-linux:
    name: Project Prometheus (Linux build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxkbcommon-dev libxtst-dev libxrender-dev libxinerama-dev \
            libwayland-dev libegl-dev libgl-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  # The online play relay (relay/), run locally by wrangler and checked from outside.
  relay:
    name: Online relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Test
        run: |
          npm run dev > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          npm test || { cat wrangler.log; exit 1; }

  # The download for players: one installer that holds the app, the core, fonts and licences.
  app-windows:
    name: Project Prometheus (Windows installer)
    runs-on: windows-latest
    needs: [core-windows, psp-core-windows]
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Code signing (SignPath Foundation's free signing for open-source projects; not set up, see
    # docs/code-signing.md): the app, its emulator cores and the installer are signed when this
    # runs on main and the SignPath project is set up (secret SIGNPATH_API_TOKEN, variables
    # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG). Otherwise
    # the build is unsigned, as before. Each signing request waits for its approval in SignPath.
    env:
      SIGN: ${{ github.ref == 'refs/heads/main' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        # Google Drive backup needs the app's Google client ID: repository secrets, never in the repo.
        # Without them the build works, with Drive backup switched off.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DP64_GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID" "-DP64_GOOGLE_CLIENT_SECRET=$env:GOOGLE_CLIENT_SECRET"
      - name: Build
        run: cmake --build build --config Release --parallel --target prometheus64
      - uses: actions/download-artifact@v8
        with:
          name: core-windows
          path: core
      - uses: actions/download-artifact@v8
        with:
          name: psp-core-windows
          path: psp-core
      - name: Stage
        shell: pwsh
        run: |
          $app = "build/apps/prometheus64/Release"
          New-Item -ItemType Directory -Force stage/cores, stage/licenses | Out-Null
          Copy-Item "$app/ProjectPrometheus.exe" stage/
          Copy-Item -Recurse "$app/assets" stage/
          Copy-Item core/mupen64plus_next_libretro.dll stage/cores/
          Copy-Item core/CORE-SOURCE.txt stage/cores/
          Copy-Item core/gpsp_libretro.dll stage/cores/
          Copy-Item core/GBA-CORE-SOURCE.txt stage/cores/
          Copy-Item core/gambatte_libretro.dll stage/cores/
          Copy-Item core/GB-CORE-SOURCE.txt stage/cores/
          # The second game of two linked on one computer runs in its own copy of the core (it keeps
          # its state in globals): shipped here, so the app never writes a program file at run time.
          Copy-Item core/gpsp_libretro.dll stage/cores/gpsp_libretro-second.dll
          Copy-Item core/gambatte_libretro.dll stage/cores/gambatte_libretro-second.dll
          Copy-Item psp-core/ppsspp_libretro.dll stage/cores/
          Copy-Item psp-core/PSP-CORE-SOURCE.txt stage/cores/
          Copy-Item -Recurse psp-core/PPSSPP stage/cores/
          Copy-Item installer/THIRD-PARTY-NOTICES.txt, installer/GPL-2.0.txt, installer/libarchive-COPYING.txt, installer/TERMS.txt, LICENSE, NOTICE, TRADEMARKS.md stage/licenses/
          Get-ChildItem -Recurse stage | Select-Object FullName, Length
      # Signing the app and its cores: the staged files go to SignPath as a build artifact, come back
      # signed (.signpath/artifact-configurations/app-files.xml says which), and replace the stage.
      - uses: actions/upload-artifact@v7
        if: env.SIGN == 'true'
        id: unsigned-app
        with:
          name: unsigned-app
          path: stage/
      - uses: signpath/github-action-submit-signing-request@v3
        if: env.SIGN == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: stage-signed
      - name: Use the signed files
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force stage
          Move-Item stage-signed stage
          Get-AuthenticodeSignature stage/ProjectPrometheus.exe, (Get-ChildItem stage/cores/*.dll) |
            Format-Table Status, @{n='File'; e={Split-Path $_.Path -Leaf}}, @{n='Signer'; e={$_.SignerCertificate.Subject}}
          if (Get-AuthenticodeSignature stage/ProjectPrometheus.exe, (Get-ChildItem stage/cores/*.dll) | Where-Object Status -ne 'Valid') {
            Write-Error "A file came back from SignPath without a valid signature"
          }
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(grep -oP 'project\(prometheus64 VERSION \K[0-9.]+' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF#refs/tags/v}; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DStageDir=$PWD\stage" installer\project-prometheus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Signing the installer itself (.signpath/artifact-configurations/installer.xml).
      - uses: actions/upload-artifact@v7
        if: env.SIGN == 'true'
        id: unsigned-installer
        with:
          name: unsigned-installer
          path: dist/ProjectPrometheus-Setup-${{ steps.version.outputs.version }}.exe
      - uses: signpath/github-action-submit-signing-request@v3
        if: env.SIGN == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed
      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $name = "ProjectPrometheus-Setup-${{ steps.version.outputs.version }}.exe"
          Copy-Item -Force "dist-signed/$name" "dist/$name"
          $sig = Get-AuthenticodeSignature "dist/$name"
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "The installer came back from SignPath without a valid signature" }
      # The installer on a real Windows computer before anyone gets it: Microsoft Defender (with
      # today's definitions) scans it, it installs silently for this user, Defender scans everything
      # it put there, it uninstalls, and nothing may be left behind: no files, no shortcuts, no file
      # types. A threat found, or a step that fails, stops the release.
      - name: Check the installer (Defender, install, uninstall)
        shell: pwsh
        run: |
          $name = "ProjectPrometheus-Setup-${{ steps.version.outputs.version }}.exe"
          $setup = (Resolve-Path "dist/$name").Path
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          $defender = Test-Path $mp
          if ($defender) {
            & $mp -SignatureUpdate | Out-Host
            Get-MpComputerStatus | Select-Object AMProductVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List | Out-Host
          } else {
            Write-Warning "Microsoft Defender isn't on this runner: install and uninstall are checked without it"
          }
          function Scan($path) {
            if (-not $defender) { return }
            & $mp -Scan -ScanType 3 -File $path -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { throw "Defender found a threat in $path" }
            if ($LASTEXITCODE -ne 0) { throw "Defender could not scan $path (exit $LASTEXITCODE)" }
            "Defender: no threat in $path"
          }
          Scan $setup
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=desktopicon,associate','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log | Out-Host; throw "Install failed (exit $($p.ExitCode))" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Project Prometheus"
          foreach ($f in 'ProjectPrometheus.exe','unins000.exe','cores\mupen64plus_next_libretro.dll','cores\gpsp_libretro.dll',
                         'cores\gpsp_libretro-second.dll','cores\gambatte_libretro.dll','cores\gambatte_libretro-second.dll',
                         'cores\ppsspp_libretro.dll','licenses\THIRD-PARTY-NOTICES.txt') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "Not installed: $f" }
          }
          if (-not (Test-Path 'HKCU:\Software\Classes\Prometheus64.Game')) { throw "The game file type wasn't registered" }
          Scan $app
          # Something the emulators may write next to themselves, as they run: the uninstaller removes it too.
          New-Item -ItemType Directory -Force (Join-Path $app 'cores\PPSSPP\cache') | Out-Null
          Set-Content (Join-Path $app 'cores\PPSSPP\cache\made-while-playing.txt') 'x'
          $p = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed (exit $($p.ExitCode))" }
          # The uninstaller finishes from a copy of itself in the temporary folder: give it a moment.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { Get-ChildItem -Recurse $app | Select-Object FullName | Out-Host; throw "Files were left behind in $app" }
          foreach ($k in 'HKCU:\Software\Classes\Prometheus64.Game','HKCU:\Software\Classes\ProjectPrometheus.OnlineKey') {
            if (Test-Path $k) { throw "Left behind in the registry: $k" }
          }
          foreach ($ext in '.z64','.gba','.gb','.gbc','.prometheuskey') {
            $v = (Get-ItemProperty -ErrorAction SilentlyContinue "HKCU:\Software\Classes\$ext").'(default)'
            if ($v -like 'Prometheus64.*' -or $v -like 'ProjectPrometheus.*') { throw "Left behind: the $ext file type" }
          }
          foreach ($lnk in "$([Environment]::GetFolderPath('Programs'))\Project Prometheus.lnk", "$([Environment]::GetFolderPath('Desktop'))\Project Prometheus.lnk") {
            if (Test-Path $lnk) { throw "Shortcut left behind: $lnk" }
          }
          "Installed, scanned and uninstalled cleanly"
      # Uploaded as the bare .exe (not zipped), so the download is the installer itself.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/ProjectPrometheus-Setup-${{ steps.version.outputs.version }}.exe
          archive: false

  # Publishes the installer as a GitHub release: push a tag like v0.1.0, or run this workflow by
  # hand on main (Actions > CI > Run workflow), which tags main with the version in CMakeLists.txt.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [app-windows, save-converters, no-game-or-save-files]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ProjectPrometheus-Setup-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.app-windows.outputs.version }}
        run: gh release create "$TAG" $(find dist -type f -name '*.exe') --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Project Prometheus ${TAG#v}" --generate-notes
